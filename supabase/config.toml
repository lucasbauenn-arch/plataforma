project_id = "arken-incorporadora"

# Remoto: https://xucwjsycawizrlouqkvh.supabase.co
# `supabase config push` envia as seções [auth] abaixo para o projeto — revise o diff antes de confirmar.
# Segredos via env(): coloque RESEND_API_KEY em supabase/.env (não versionado).

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed_wordpress.sql"]

[functions.cliente-login]
# chamada pelo portal antes do login (sem JWT de usuário)
verify_jwt = false

[functions.enviar-lead]
# formulário público de contato; valida o Turnstile no código
verify_jwt = false

[functions.notificar]
# chamada só pelos gatilhos do banco (pg_net); autenticada pelo header x-webhook-secret
verify_jwt = false

[functions.convidar-parceiros]
# a função valida o JWT e exige papel admin no próprio código (funciona também com as chaves novas)
verify_jwt = false

[auth]
site_url = "https://arkenincorporadora.com.br"
additional_redirect_urls = [
  "https://arkenincorporadora.com.br/**",
  "https://www.arkenincorporadora.com.br/**",
  "http://localhost:*/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# e-mails por hora (só vale com SMTP próprio)
email_sent = 60
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
# parceiro precisa confirmar o e-mail no cadastro
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
# validade dos links de e-mail (convite de parceiro via WhatsApp, recuperação de senha): 24 h
otp_expiry = 86400

[auth.email.template.magic_link]
subject = "Seu código de acesso — Arken Incorporadora"
content_path = "./supabase/templates/codigo-acesso.html"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail — Arken Incorporadora"
content_path = "./supabase/templates/confirmar-cadastro.html"

[auth.email.template.recovery]
subject = "Redefinir senha — Arken Incorporadora"
content_path = "./supabase/templates/recuperar-senha.html"

[auth.email.template.invite]
subject = "Seu acesso de parceiro — Arken Incorporadora"
content_path = "./supabase/templates/convite.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail — Arken Incorporadora"
content_path = "./supabase/templates/trocar-email.html"

# Cloudflare Turnstile no cadastro, login e recuperação de senha de parceiro (o front manda captchaToken).
# TURNSTILE_SECRET em supabase/.env; a de teste da Cloudflare é 1x0000000000000000000000000000000AA.
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

# SMTP próprio (Resend). Requer o domínio verificado no Resend (SPF/DKIM).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "nao-responda@arkenincorporadora.com.br"
sender_name = "Arken Incorporadora"

[auth.sms]
enable_signup = false
